name: macOS build and core tests
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Report Apple toolchain (deployment target remains Sonoma 14.5)
        run: xcodebuild -version
      - name: Test and package Apple Silicon app
        run: ./scripts/check.sh
      - name: Build development Universal 2 installer
        run: |
          ./scripts/package-dmg.sh universal
          ditto -c -k --sequesterRsrc --keepParent 'build/Glass Folder.app' build/Glass-Folder-1.2.0-universal.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Glass-Folder-development-universal
          path: |
            build/Glass-Folder-1.2.0-universal.dmg
            build/Glass-Folder-1.2.0-universal.app.zip
          if-no-files-found: error
