name: GlassFinder
options:
  deploymentTarget:
    macOS: "14.5"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.5"
    CODE_SIGN_STYLE: Automatic
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  GlassFinderCore:
    type: framework
    platform: macOS
    sources: [Sources/GlassFinderCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassfinder.core
        GENERATE_INFOPLIST_FILE: YES
  GlassFinder:
    type: application
    platform: macOS
    sources:
      - path: Sources/GlassFinder
        excludes: [Resources]
      - path: Sources/GlassFinder/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassfinder.app
        INFOPLIST_FILE: Resources/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: GlassFinderCore
        embed: true
    preBuildScripts:
      - name: Generate application icon
        script: '"$SRCROOT/scripts/make-icon.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Copy application icon
        script: 'cp "$SRCROOT/build/AppIcon.icns" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppIcon.icns"'
        basedOnDependencyAnalysis: false
  GlassFinderCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/GlassFinderCoreTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassfinder.coretests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GlassFinderCore
schemes:
  GlassFinder:
    build:
      targets:
        GlassFinder: all
        GlassFinderCoreTests: [test]
    test:
      targets: [GlassFinderCoreTests]
